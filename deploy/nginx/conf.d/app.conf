# DOMAIN-ийг өөрийн домэйнээр солих:
#   sed -i 's/__DOMAIN__/your-domain.com/g' deploy/nginx/conf.d/app.conf

upstream nextjs_upstream {
    server app:3000;
}

# HTTP → HTTPS redirect + Let's Encrypt ACME challenge
server {
    listen 80;
    listen [::]:80;
    server_name horom.mn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name horom.mn;

    ssl_certificate     /etc/letsencrypt/live/horom.mn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/horom.mn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Зургийн upload-ийн дээд хэмжээ (ChatGPT-ийн пример: 10MB)
    client_max_body_size 10M;

    # Сүлжээний buffer-уудыг урт photo upload-д тохируулна
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    # Хэт ширүүн hotlinking-аас сэргийлэхэд hsts хэрэгтэй бол:
    # add_header Strict-Transport-Security "max-age=63072000" always;

    location / {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Next.js статик файлуудыг ширүүн кэшлэх
    location /_next/static/ {
        proxy_pass http://nextjs_upstream;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
